  <rect width="1600" height="1080" fill="#FAFAF7"/><text x="55" y="52" class="title">中國大陸省級經濟與供應鏈圖譜</text><text x="55" y="84" class="sub">31 個省、自治區與直轄市；標註省級功能與代表產業，不呈現設施位置。</text><image x="55" y="120" width="1050" height="820" href="osm_china_base.png" preserveAspectRatio="none"/><rect x="55" y="120" width="1050" height="820" fill="#FFFFFF" opacity="0.20"/><rect x="55" y="120" width="1050" height="820" rx="16" fill="none" stroke="#CBD5E1" stroke-width="2"/><circle cx="783.4" cy="474.4" r="7" fill="#6C5CE7" stroke="#FFFFFF" stroke-width="2"><title>北京市｜全國行政決策與高端服務及創新資源配置</title></circle><text x="771.4" y="461.4" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">北京</text><circle cx="796.6" cy="492.0" r="7" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"><title>天津市｜京津冀海運門戶與北方先進製造節點</title></circle><text x="817.6" y="504.0" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">天津</text><circle cx="755.5" cy="509.5" r="7" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"><title>河北省｜京津冀製造配套、原材料加工與北方物流銜接</title></circle><text x="738.5" y="529.5" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">河北</text><circle cx="716.2" cy="526.7" r="7" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"><title>山西省｜全國能源與材料供應、資源型經濟轉型</title></circle><text x="726.2" y="516.7" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">山西</text><circle cx="706.3" cy="385.3" r="7" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"><title>內蒙古自治區｜北方能源、戰略材料、農畜產品與對蒙俄經貿門戶</title></circle><text x="716.3" y="375.3" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">內蒙古</text><circle cx="898.3" cy="440.7" r="7" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"><title>遼寧省｜東北工業基地、海運門戶與裝備材料供應中心</title></circle><text x="908.3" y="430.7" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">遼寧</text><circle cx="929.5" cy="387.6" r="7" fill="#43AA8B" stroke="#FFFFFF" stroke-width="2"><title>吉林省｜東北汽車製造、糧食加工與對東北亞連結</titl