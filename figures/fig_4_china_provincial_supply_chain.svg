oke-width="3">山東</text><circle cx="737.5" cy="600.1" r="7" fill="#009E73" stroke="#FFFFFF" stroke-width="2"><title>河南省｜中部交通樞紐、糧食食品與承接製造業轉移中心</title></circle><text x="725.5" y="586.1" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">河南</text><circle cx="716.2" cy="662.6" r="7" fill="#56B4E9" stroke="#FFFFFF" stroke-width="2"><title>湖北省｜長江中游物流、光電子、汽車與高端服務中心</title></circle><text x="731.2" y="678.6" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">湖北</text><circle cx="726.0" cy="725.0" r="7" fill="#56B4E9" stroke="#FFFFFF" stroke-width="2"><title>湖南省｜中部工程機械、軌道交通裝備、農業與文化服務基地</title></circle><text x="736.0" y="715.0" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">湖南</text><circle cx="732.6" cy="806.2" r="7" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"><title>廣東省｜大灣區出口製造、科技創新、全球採購與消費市場核心</title></circle><text x="744.6" y="824.2" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">廣東</text><circle cx="650.5" cy="798.7" r="7" fill="#CC79A7" stroke="#FFFFFF" stroke-width="2"><title>廣西壯族自治區｜中國—東盟門戶、西南出海通道與有色材料及農食加工基地</title></circle><text x="660.5" y="788.7" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">廣西</text><circle cx="673.5" cy="882.9" r="7" fill="#8E6BBE" stroke="#FFFFFF" stroke-width="2"><title>海南省｜自由貿易港、旅遊與現代服務、熱帶農業及消費服務節點</title></circle><text x="685.5" y="896.9" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">海南</text><circle cx="622.7" cy="688.2" r="7" fill="#56B4E9" stroke="#FFFFFF" stroke-width="2"><title>重慶市｜成渝製造、內陸出口與西部多式聯運中心</title></circle><text x="640.7" y="698.2" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">重慶</text><circle cx="576.7" cy="668.5" r="7" fill="#56B4E9" stroke="#FFFFFF" stroke-width="2"><title>四川省｜西部人口與消費中心、電子裝備製造、清潔能源與農食供應基地</title></circle><text x="586.7" y="658.5" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">四川</text><circle cx="624.3" cy="742.3" r="7" fill="#E69F00" stroke="#FFFFFF" stroke-width="2"><title>貴州省｜西南能源材料、資料服務、特色食品與農業供應基地</title></circle><text x="634.3" y="732.3" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">貴州</text><circle cx="539.0" cy="781.9" r="7" fill="#CC79A7" stroke="#FFFFFF" stroke-width="2"><title>雲南省｜西南跨境門戶、綠色能源與有色材料、高原農業供應基地</title></circle><text x="549.0" y="771.9" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">雲南</text><circle cx="325.7" cy="646.7" r="7" fill="#A06CD5" stroke="#FFFFFF" stroke-width="2"><title>西藏自治區｜高原公共服務、清潔能源、特色農牧業與南亞方向商貿通道</title></circle><text x="335.7" y="636.7" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">西藏</text><circle cx="660.4" cy="575.3" r="7" fill="#E76F51" stroke="#FFFFFF" stroke-width="2"><title>陝西省｜西北科教、先進製造、能源化工與東西向物流中心</title></circle><text x="670.4" y="565.3" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">陝西</text><circle cx="576.7" cy="556.4" r="7" fill="#F4A261" stroke="#FFFFFF" stroke-width="2"><title>甘肅省｜西北能源材料、農產品與向西物流通道</title></circle><text x="586.7" y="546.4" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">甘肅</text><circle cx="448.8" cy="569.0" r="7" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"><title>青海省｜鹽湖材料、清潔能源、綠色算力與高原農牧產品供應基地</title></circle><text x="458.8" y="559.0" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">青海</text><circle cx="616.1" cy="531.0" r="7" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"><title>寧夏回族自治區｜西北煤化工、新材料、清潔能源與特色農牧產品基地</title></circle><text x="634.1" y="521.0" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">寧夏</text><circle cx="278.1" cy="438.5" r="7" fill="#B5651D" stroke="#FFFFFF" stroke-width="2"><title>新疆維吾爾自治區｜全國能源資源、棉花與農食供應，以及面向中亞的陸路商貿門戶</title></circle><text x="288.1" y="428.5" class="label" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">新疆</text><g transform="translate(1140 120)" filter="url(#shadow)"><rect width="405" height="820" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#D7DEE5"/><text x="25" y="42" class="head">31 省級經濟功能</text><text x="25" y="72" class="body">點位代表省級行政區，不是設施。</text><circle cx="35" cy="120" r="9" fill="#0072B2"/><text x="58" y="118" class="label">沿海製造</text><text x="58" y="142" class="body">港航／出口／先進製造</text><circle cx="35" cy="194" r="9" fill="#56B4E9"/><text x="58" y="192" class="label">內陸製造</text><text x="58" y="216" class="body">公鐵／長江／承接製造</text><circle cx="35" cy="268" r="9" fill="#D55E00"/><text x="58" y="266" class="label">能源材料</text><text x="58" y="290" class="body">煤油氣／電力／礦產材料</text><circle cx="35" cy="342" r="9" fill="#009E73"/><text x="58" y="340" class="label">農業物流</text><text x="58" y="364" class="body">糧食／食品／冷鏈分撥</text><circle cx="35" cy="416" r="9" fill="#CC79A7"/><text x="58" y="414" class="label">邊境物流</text><text x="58" y="438" class="body">陸路口岸／跨境商貿</text><circle cx="35" cy="490" r="9" fill="#6C5CE7"/><text x="58" y="488" class="label">服務創新</text><text x="58" y="512" class="body">治理／金融／研發／數位</text><line x1="25" y1="575" x2="380" y2="575" stroke="#D7DEE5"/><text x="25" y="610" class="head">欄位</text><text x="25" y="643" class="body">基礎設施類型（非設施清單）</text><text x="25" y="674" class="body">公共與經濟功能</text><text x="25" y="705" class="body">代表性產品／產業群</text><text x="25" y="736" class="body">主要上游投入與下游連結</text><text x="25" y="790" class="note">完整內容請開啟互動圖或 CSV。</text></g><a href="https://www.openstreetmap.org/copyright"><rect x="680" y="906" width="410" height="25" rx="7" fill="#FFFFFF" fill-opacity="0.9"/><text x="690" y="923" class="note">© OpenStreetMap contributors · ODbL · openstreetmap.org/copyright</text></a><text x="55" y="995" class="note">用途：產業政策、供應鏈研究與韌性規劃。排除設施名稱、座標、容量、瓶頸與軍事部署。</text></svg>