<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">中國沿海戰區級態勢概覽（非部署圖）</title><desc id="desc">北部、東部與南部戰區層級的沿海責任方向概覽。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F2937" flood-opacity="0.17"/></filter>
  <style>.title{font:700 34px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#1F2937}.sub{font:400 17px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#5B6472}.label{font:600 12px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#23313F}.body{font:400 15px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#374151}.head{font:700 21px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#23313F}.note{font:400 13px 'PingFang TC','Noto Sans CJK TC',sans-serif;fill:#4B5563}</style></defs>
  <rect width="1600" height="1080" fill="#FAFAF7"/><text x="55" y="52" class="title">中國沿海戰區級態勢概覽（非部署圖）</text><text x="55" y="84" class="sub">戰區責任方向與公開活動型態；不標示部隊、基地、兵力、裝備或即時位置。</text><image x="55" y="120" width="1050" height="820" href="osm_china_base.png" preserveAspectRatio="none"/><rect x="55" y="120" width="1050" height="820" fill="#FFFFFF" opacity="0.25"/><rect x="55" y="120" width="1050" height="820" rx="16" fill="none" stroke="#CBD5E1" stroke-width="2"/><path d="M 908.1 454.3 Q 1027.9 378.3 1047.6 392.3" fill="none" stroke="#5B8FF9" stroke-width="18" stroke-linecap="round" opacity="0.55"/><circle cx="908.1" cy="454.3" r="13" fill="#5B8FF9" stroke="#FFFFFF" stroke-width="4"/><text x="838.1" y="429.3" class="head" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">北部戰區層級</text><text x="853.1" y="489.3" class="body" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">黃海／東北方向</text><path d="M 875.3 699.9 Q 1032.0 669.4 1088.6 728.9" fill="none" stroke="#E76F51" stroke-width="18" stroke-linecap="round" opacity="0.55"/><circle cx="875.3" cy="699.9" r="13" fill="#E76F51" stroke="#FFFFFF" stroke-width="4"/><text x="805.3" y="674.9" class="head" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">東部戰區層級</text><text x="820.3" y="734.9" class="body" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">東海／臺灣方向</text><path d="M 711.3 832.0 Q 835.1 836.6 858.9 931.1" fill="none" stroke="#2A9D8F" stroke-width="18" stroke-linecap="round" opacity="0.55"/><circle cx="711.3" cy="832.0" r="13" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="4"/><text x="641.3" y="807.0" class="head" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">南部戰區層級</text><text x="656.3" y="867.0" class="body" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">南海方向／可跨區支援</text><g transform="translate(1140 120)" filter="url(#shadow)"><rect width="405" height="820" rx="16" fill="#FFFFFF" fill-opacity="0.96" stroke="#D7DEE5"/><text x="25" y="42" class="head">讀圖邊界</text><text x="25" y="82" class="body">• 僅為戰區層級責任方向</text><text x="25" y="117" class="body">• 不代表實際部署位置</text><text x="25" y="152" class="body">• 不與基礎設施共圖</text><line x1="25" y1="185" x2="380" y2="185" stroke="#D7DEE5"/><text x="25" y="225" class="head">公開活動類型</text><text x="25" y="265" class="body">聯合指揮與戰備警巡</text><text x="25" y="302" class="body">海空聯合演訓</text><text x="25" y="339" class="body">封鎖相關演訓（東部方向）</text><text x="25" y="376" class="body">灰色地帶與海警協同</text><text x="25" y="413" class="body">跨戰區支援</text><line x1="25" y1="450" x2="380" y2="450" stroke="#D7DEE5"/><text x="25" y="490" class="head">明確排除</text><text x="25" y="530" class="body">部隊番號／基地／座標</text><text x="25" y="567" class="body">兵力／裝備／戰備狀態</text><text x="25" y="604" class="body">射程／行動半徑／調動時間</text><text x="25" y="641" class="body">即時或可預測的部署資訊</text><text x="25" y="730" class="note">來源：臺灣國防部 2025 國防報告；</text><text x="25" y="755" class="note">美國國防部 2025 中國軍力報告。</text></g><a href="https://www.openstreetmap.org/copyright"><rect x="680" y="906" width="410" height="25" rx="7" fill="#FFFFFF" fill-opacity="0.9"/><text x="690" y="923" class="note">© OpenStreetMap contributors · ODbL · openstreetmap.org/copyright</text></a><text x="55" y="995" class="note">本圖描述宏觀責任方向與公開活動類型，不是部隊部署圖、目標圖或即時態勢圖。</text></svg>